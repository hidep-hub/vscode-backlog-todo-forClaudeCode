<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backlog Dashboard</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <img src="favicon.png" alt="" class="header-logo" id="header-logo" title="GitHubリポジトリを開く">
      <h1><span class="header-title-main">BackLog</span><span class="header-title-sub">Dashboard</span></h1>
    </div>
    <span id="project-badges" class="project-badges"></span>
    <div class="header-controls">
      <button class="search-btn" id="search-btn" title="検索: タイトル・ID・説明・担当（/ または Ctrl+K）">🔍</button>
      <button class="today-filter-btn" id="today-filter-btn" title="今日やるフィルター">📌</button>
      <button class="select-mode-btn" id="select-mode-btn" title="複数選択して親タスクにまとめる">✓ 選択</button>
      <select class="filter-select" id="project-filter" title="Workspace filter">
        <option value="">All Projects</option>
      </select>
      <select class="theme-select" id="theme-select" title="Theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="system">System</option>
      </select>
      <button class="github-import-btn" id="github-import-btn" title="GitHub Issuesを取り込む">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      </button>
      <button class="settings-btn" id="settings-btn" title="Settings">&#9881;</button>
      <span class="status" id="status">connecting...</span>
    </div>
  </header>
  <div class="running-strip" id="running-strip"></div>
  <main class="board" id="board">
    <!-- columns rendered by app.js -->
  </main>

  <!-- Settings Panel -->
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel">
      <button class="settings-close" id="settings-close">&times;</button>
      <h3>Settings</h3>
      <div class="settings-group">
        <label>Theme</label>
        <select id="settings-theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">System</option>
        </select>
      </div>
      <div class="settings-group">
        <label>Accent Color</label>
        <input type="color" id="settings-accent" value="#7c8fff">
      </div>
      <div class="settings-group settings-group-github">
        <label>GitHub連携（ワークスペース単位）</label>
        <select id="settings-github-project"></select>
        <input type="text" id="settings-github-repo-url" placeholder="https://github.com/owner/repo">
        <input type="password" id="settings-github-token" placeholder="トークンを入力（未入力なら既存を保持）">
        <p class="settings-github-hint" id="settings-github-hint">Fine-grained PAT発行時は Repository permissions に「Issues: Read and write」を追加してください（Contents権限だけでは取得はできても作成・更新ができません）</p>
        <div class="settings-github-footer">
          <span id="settings-github-status"></span>
          <button id="settings-github-save">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
